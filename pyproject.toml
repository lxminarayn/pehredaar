[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pehredaar"
version = "0.1.0"
description = "Framework-neutral execution guardrails for agentic tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Laxminarayan Chandrashekar" }]
keywords = ["ai-agents", "authorization", "guardrails", "llm-security", "policy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
agent-guardrails = "cli:main"
pehredaar = "cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["guardrails", "cli.py", "templates"]
# Editable installs point at the checkout so cli.py, demo/ and attacks/ stay live.
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["guardrails", "cli.py", "demo", "examples"]
exclude = ["demo/workspace/"]
