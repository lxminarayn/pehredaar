version: 1
tools:
  read_support_ticket:
    effect: read
    args: { ticket_id: { type: string, pattern: "T-[0-9]{3,6}" } }
    scope: tickets:read
    reversible: true
    approval: never
    output_trust: untrusted
  query_customer_db:
    effect: read
    args: { customer_id: { type: string, pattern: "CUST-[0-9]{3,6}" } }
    scope: customers:read
    reversible: true
    approval: never
    output_trust: sensitive
  issue_refund:
    effect: write
    args:
      customer_id: { type: string, pattern: "CUST-[0-9]{3,6}" }
      amount_usd: { type: number, minimum: 0.01, ask_above: 50, maximum: 500 }
      destination_iban: { type: string, pattern: "[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}" }
    scope: refunds:write
    reversible: true
    approval: when_tainted
  run_diagnostic_script:
    effect: write
    args: { python_code: { type: string, max_length: 2000 } }
    scope: diagnostics:run
    reversible: true
    approval: never
    egress: true
  format_currency:
    effect: read
    args: { amount: { type: number }, currency: { type: enum, values: [USD, EUR, INR] } }
    scope: tickets:read
    reversible: true
    approval: never
